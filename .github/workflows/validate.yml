name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check repository baseline
        shell: bash
        run: |
          set -euo pipefail
          for f in README.md LICENSE ROADMAP.md docs/PROFILE_SPEC.md software/README.md profiles/README.md lib/README.md tests/README.md tools/README.md lib/common.sh lib/compat.sh lib/lifecycle.sh tools/dietpi-software-extra tools/manifest-env.py tools/validate-manifests.py tests/test-framework.sh tests/test-compat.sh tests/test-lifecycle.sh tests/test-endlessh.sh; do
            test -s "$f"
          done
      - name: Shell syntax
        run: |
          bash -n lib/common.sh lib/compat.sh lib/lifecycle.sh tools/dietpi-software-extra
          bash -n tests/test-framework.sh tests/test-compat.sh tests/test-lifecycle.sh tests/test-endlessh.sh
          bash -n tests/fixtures/example/install tests/fixtures/example/status tests/fixtures/example/remove
          bash -n software/endlessh/install software/endlessh/status software/endlessh/remove
      - name: ShellCheck
        run: |
          shellcheck lib/common.sh lib/compat.sh lib/lifecycle.sh tools/dietpi-software-extra
          shellcheck tests/test-framework.sh tests/test-compat.sh tests/test-lifecycle.sh tests/test-endlessh.sh
          shellcheck tests/fixtures/example/install tests/fixtures/example/status tests/fixtures/example/remove
          shellcheck software/endlessh/install software/endlessh/status software/endlessh/remove
      - name: Validate manifests
        run: |
          python3 tools/validate-manifests.py
          python3 tools/validate-manifests.py --root tests/fixtures
      - name: Framework tests
        run: |
          bash tests/test-framework.sh
          bash tests/test-compat.sh
          bash tests/test-lifecycle.sh
          bash tests/test-endlessh.sh

  endlessh-package:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
      - uses: actions/checkout@v5
      - name: Verify Endlessh package on Debian Trixie
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y endlessh systemd
          command -v endlessh
          unit=/lib/systemd/system/endlessh.service
          test -f "$unit" || unit=/usr/lib/systemd/system/endlessh.service
          test -f "$unit"
          test -d /etc/endlessh
          dpkg-query -W -f='${Status} ${Version}\n' endlessh | grep -q '^install ok installed '
          dpkg-query -L endlessh | grep -qx '/usr/bin/endlessh'
          dpkg-query -L endlessh | grep -qx "$unit"
          grep -Eq '^ExecStart=.*endlessh' "$unit"
      - name: Validate integration against package layout
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ENDLESSH_PORT:-2222' software/endlessh/install
          grep -q '/etc/endlessh/config' software/endlessh/install
